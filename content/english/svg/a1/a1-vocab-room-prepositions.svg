<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="floorBg" x1="0" y1="430" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="400" cy="312" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Room Wall & Floor -->
  <rect width="800" height="430" fill="url(#wallBg)"/>
  <rect y="430" width="800" height="170" fill="url(#floorBg)"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#94A3B8" stroke-width="2"/>

  <!-- Subtle Zone Dividers on Wall (3 Pedagogical Zones) -->
  <rect x="26" y="34" width="234" height="374" rx="20" fill="#FFFFFF" opacity="0.65" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="282" y="34" width="236" height="374" rx="20" fill="#FFFFFF" opacity="0.65" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="540" y="34" width="234" height="374" rx="20" fill="#FFFFFF" opacity="0.65" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Decorative Framed Picture on Center Wall -->
  <rect x="352" y="74" width="96" height="72" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="382" cy="102" r="11" fill="#FBBF24"/>
  <path d="M358 138 L386 114 L410 132 L426 118 L442 138 Z" fill="#10B981" opacity="0.8"/>

  <!-- ========================================================= -->
  <!-- ZONE 1 (LEFT): BESIDE — Notebook on small stand beside desk -->
  <!-- ========================================================= -->
  <g id="zone-beside" filter="url(#cardShadow)">
    <!-- Floor shadow -->
    <ellipse cx="143" cy="466" rx="95" ry="12" fill="#0F172A" opacity="0.1"/>
    <!-- Study Desk -->
    <rect x="48" y="330" width="122" height="16" rx="6" fill="#4F46E5"/>
    <rect x="56" y="346" width="14" height="114" rx="5" fill="#312E81"/>
    <rect x="148" y="346" width="14" height="114" rx="5" fill="#312E81"/>
    <!-- Cup with pencil on desk -->
    <rect x="74" y="294" width="24" height="36" rx="5" fill="#10B981"/>
    <rect x="82" y="274" width="5" height="22" rx="2" fill="#F59E0B" transform="rotate(-10 84 285)"/>
    <rect x="89" y="276" width="5" height="20" rx="2" fill="#6366F1" transform="rotate(8 91 286)"/>

    <!-- Small Side Stand BESIDE the desk (to the right of desk) -->
    <rect x="184" y="366" width="58" height="12" rx="4" fill="#64748B"/>
    <rect x="192" y="378" width="10" height="82" rx="4" fill="#475569"/>
    <rect x="224" y="378" width="10" height="82" rx="4" fill="#475569"/>
    <!-- Bright Amber Notebook clearly BESIDE the desk -->
    <rect x="188" y="344" width="48" height="22" rx="5" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <rect x="194" y="349" width="36" height="4" rx="2" fill="#FEF3C7"/>
    <rect x="194" y="357" width="26" height="4" rx="2" fill="#FEF3C7"/>
  </g>

  <!-- ========================================================= -->
  <!-- ZONE 2 (CENTER): BETWEEN — Glowing Lamp between chair & shelf -->
  <!-- ========================================================= -->
  <g id="zone-between" filter="url(#cardShadow)">
    <ellipse cx="400" cy="468" rx="108" ry="12" fill="#0F172A" opacity="0.1"/>
    <!-- Left Chair -->
    <rect x="298" y="290" width="14" height="90" rx="6" fill="#312E81"/>
    <rect x="298" y="368" width="60" height="14" rx="6" fill="#4F46E5"/>
    <rect x="304" y="382" width="12" height="80" rx="5" fill="#312E81"/>
    <rect x="342" y="382" width="12" height="80" rx="5" fill="#312E81"/>
    <rect x="302" y="358" width="52" height="10" rx="5" fill="#6366F1"/>

    <!-- Right Bookshelf (Shelf) -->
    <rect x="442" y="268" width="64" height="194" rx="6" fill="#475569"/>
    <rect x="448" y="276" width="52" height="174" rx="4" fill="#CBD5E1"/>
    <!-- Top Shelf Compartment + Books -->
    <rect x="452" y="286" width="12" height="44" rx="2" fill="#4F46E5"/>
    <rect x="466" y="292" width="10" height="38" rx="2" fill="#F59E0B"/>
    <rect x="478" y="288" width="11" height="42" rx="2" fill="#10B981"/>
    <rect x="444" y="330" width="60" height="8" rx="2" fill="#334155"/>
    <!-- Middle Shelf Compartment + Books & Box -->
    <rect x="453" y="348" width="11" height="42" rx="2" fill="#2563EB"/>
    <rect x="466" y="352" width="10" height="38" rx="2" fill="#F43F5E"/>
    <rect x="480" y="366" width="16" height="24" rx="4" fill="#0EA5E9"/>
    <rect x="444" y="390" width="60" height="8" rx="2" fill="#334155"/>
    <!-- Bottom Shelf Compartment + Stacked Books -->
    <rect x="456" y="426" width="34" height="11" rx="3" fill="#10B981"/>
    <rect x="453" y="437" width="40" height="13" rx="3" fill="#6366F1"/>
    <rect x="442" y="450" width="64" height="12" rx="4" fill="#334155"/>

    <!-- Small Center Table + Glowing Lamp BETWEEN the chair and the shelf -->
    <rect x="370" y="376" width="60" height="12" rx="5" fill="#475569"/>
    <rect x="394" y="388" width="12" height="74" rx="5" fill="#334155"/>
    <rect x="378" y="454" width="44" height="10" rx="5" fill="#334155"/>
    <circle cx="400" cy="316" r="68" fill="url(#lampGlow)"/>
    <rect x="386" y="366" width="28" height="10" rx="4" fill="#0F172A"/>
    <rect x="396" y="340" width="8" height="28" rx="3" fill="#64748B"/>
    <path d="M374 342 L384 300 L416 300 L426 342 Z" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  </g>

  <!-- ========================================================= -->
  <!-- ZONE 3 (RIGHT): BEHIND — Backpack partially occluded behind armchair -->
  <!-- ========================================================= -->
  <g id="zone-behind" filter="url(#cardShadow)">
    <ellipse cx="656" cy="468" rx="94" ry="12" fill="#0F172A" opacity="0.1"/>
    <!-- Blue Backpack positioned BEHIND the armchair (drawn first so armchair occludes lower half) -->
    <g id="backpack-behind">
      <path d="M622 258 Q622 238 644 238 L674 238 Q696 238 696 258 L702 356 L616 356 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
      <path d="M642 238 Q659 218 676 238" stroke="#1E40AF" stroke-width="6" stroke-linecap="round" fill="none"/>
      <rect x="634" y="274" width="50" height="32" rx="8" fill="#60A5FA" opacity="0.85"/>
    </g>

    <!-- Cozy Emerald Armchair in FRONT of the backpack -->
    <rect x="580" y="294" width="152" height="102" rx="28" fill="#059669"/>
    <rect x="594" y="308" width="124" height="68" rx="20" fill="#10B981"/>
    <!-- Armrests -->
    <rect x="564" y="340" width="32" height="82" rx="14" fill="#047857"/>
    <rect x="716" y="340" width="32" height="82" rx="14" fill="#047857"/>
    <!-- Seat Cushion -->
    <rect x="584" y="376" width="144" height="46" rx="14" fill="#34D399"/>
    <!-- Chair Legs -->
    <rect x="586" y="422" width="14" height="40" rx="5" fill="#334155"/>
    <rect x="712" y="422" width="14" height="40" rx="5" fill="#334155"/>
  </g>
</svg>
