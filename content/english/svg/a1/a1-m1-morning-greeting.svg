<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="morningSky" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="48%" stop-color="#E0EAFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="sunrise" cx="140" cy="140" r="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FDE68A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="430" fill="url(#morningSky)"/>
  <circle cx="140" cy="140" r="145" fill="url(#sunrise)"/>
  <circle cx="140" cy="140" r="34" fill="#FBBF24"/>

  <!-- School Gate Archway -->
  <g filter="url(#softDrop)">
    <rect x="200" y="138" width="400" height="292" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="190" y="124" width="420" height="18" rx="6" fill="#4F46E5"/>
    <path d="M330 430 L330 245 Q330 190 400 190 Q470 190 470 245 L470 430 Z" fill="#1E1B4B"/>
    <rect x="346" y="274" width="52" height="156" rx="4" fill="#E0EAFF"/>
    <rect x="402" y="274" width="52" height="156" rx="4" fill="#E0EAFF"/>
    <!-- Windows -->
    <rect x="234" y="200" width="60" height="72" rx="10" fill="#DBEAFE" stroke="#94A3B8" stroke-width="2"/>
    <rect x="506" y="200" width="60" height="72" rx="10" fill="#DBEAFE" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- Trees -->
  <circle cx="88" cy="272" r="68" fill="#10B981"/>
  <circle cx="130" cy="300" r="52" fill="#059669"/>
  <rect x="96" y="340" width="18" height="90" rx="6" fill="#64748B"/>
  <circle cx="710" cy="270" r="68" fill="#10B981"/>
  <circle cx="670" cy="300" r="52" fill="#059669"/>
  <rect x="688" y="340" width="18" height="90" rx="6" fill="#64748B"/>

  <!-- Ground -->
  <rect y="430" width="800" height="170" fill="#E2E8F0"/>
  <polygon points="320,430 480,430 620,600 180,600" fill="#F8FAFC"/>

  <!-- Student Madina (Left) -->
  <g id="student">
    <ellipse cx="290" cy="526" rx="44" ry="10" fill="#0F172A" opacity="0.12"/>
    <rect x="252" y="310" width="26" height="56" rx="12" fill="#4338CA"/>
    <rect x="272" y="424" width="14" height="84" rx="6" fill="#F3C6A5"/>
    <rect x="296" y="424" width="14" height="84" rx="6" fill="#EBB894"/>
    <path d="M265 366 L316 366 L326 434 L256 434 Z" fill="#1E293B"/>
    <rect x="264" y="294" width="52" height="76" rx="16" fill="#4F46E5"/>
    <!-- Waving arm -->
    <path d="M312 310 Q344 294 358 264" stroke="#4F46E5" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="360" cy="258" r="9" fill="#F3C6A5"/>
    <circle cx="290" cy="260" r="24" fill="#F3C6A5"/>
    <path d="M266 260 Q268 232 292 232 Q314 232 314 256 Q298 246 272 260 Z" fill="#1E293B"/>
    <circle cx="295" cy="260" r="2.5" fill="#0F172A"/>
    <circle cx="307" cy="260" r="2.5" fill="#0F172A"/>
    <path d="M294 271 Q300 276 306 271" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Teacher Karim (Right) -->
  <g id="teacher">
    <ellipse cx="498" cy="528" rx="48" ry="10" fill="#0F172A" opacity="0.12"/>
    <rect x="476" y="388" width="20" height="124" rx="8" fill="#334155"/>
    <rect x="502" y="388" width="20" height="124" rx="8" fill="#1E293B"/>
    <rect x="466" y="280" width="64" height="114" rx="18" fill="#10B981"/>
    <polygon points="488,280 498,308 508,280" fill="#FFFFFF"/>
    <!-- Greeting Wave -->
    <path d="M470 302 Q442 294 430 264" stroke="#10B981" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="428" cy="256" r="9" fill="#FAD7C0"/>
    <!-- Holding Folder -->
    <rect x="518" y="330" width="28" height="38" rx="4" fill="#F59E0B"/>
    <circle cx="498" cy="242" r="26" fill="#FAD7C0"/>
    <path d="M472 240 Q474 212 498 212 Q522 212 524 240 Q510 228 486 232 Z" fill="#334155"/>
    <circle cx="486" cy="242" r="2.5" fill="#0F172A"/>
    <circle cx="500" cy="242" r="2.5" fill="#0F172A"/>
    <path d="M486 254 Q493 260 500 254" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
