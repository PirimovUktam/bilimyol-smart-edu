<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="storyBg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="storyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#storyBg)"/>

  <!-- Continuous Timeline Track Behind the 3 Cards -->
  <line x1="80" y1="536" x2="720" y2="536" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="154" cy="536" r="12" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="400" cy="536" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="646" cy="536" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Card 1 (Left): Ongoing Background Action (Presentation + Continuous Wave Ribbon) -->
  <g filter="url(#storyShadow)">
    <rect x="40" y="72" width="228" height="416" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="40" y="72" width="228" height="22" rx="11" fill="#0EA5E9"/>

    <!-- Presentation Screen -->
    <rect x="68" y="124" width="172" height="106" rx="10" fill="#1E293B"/>
    <rect x="78" y="134" width="152" height="86" rx="6" fill="#E0F2FE"/>
    <!-- Bar Chart Inside Screen -->
    <rect x="98" y="182" width="20" height="26" rx="3" fill="#0EA5E9"/>
    <rect x="130" y="164" width="20" height="44" rx="3" fill="#4F46E5"/>
    <rect x="162" y="150" width="20" height="58" rx="3" fill="#10B981"/>
    <rect x="194" y="170" width="20" height="38" rx="3" fill="#38BDF8"/>

    <!-- Two Seated Team Silhouettes -->
    <circle cx="114" cy="272" r="18" fill="#4F46E5"/>
    <path d="M84 328 Q84 298 114 298 Q144 298 144 328 Z" fill="#4F46E5"/>
    <circle cx="194" cy="272" r="18" fill="#0EA5E9"/>
    <path d="M164 328 Q164 298 194 298 Q224 298 224 328 Z" fill="#0EA5E9"/>

    <!-- Continuous Flowing Wave Ribbon (Ongoing Past Continuous) -->
    <path d="M62 394 Q92 368 122 394 T182 394 T246 394" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M62 426 Q92 400 122 426 T182 426 T246 426" stroke="#7DD3FC" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Connector Arrow 1 -> 2 -->
  <path d="M272 280 L282 280" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

  <!-- Card 2 (Center): Interruption (Lightning Bolt) + Colleague Passing Portable Battery -->
  <g filter="url(#storyShadow)">
    <rect x="286" y="72" width="228" height="416" rx="22" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
    <rect x="286" y="72" width="228" height="22" rx="11" fill="#F59E0B"/>

    <!-- Storm / Power Cut Lightning Bolt Intersecting Wave -->
    <path d="M312 184 Q346 164 380 184 T488 184" stroke="#94A3B8" stroke-width="5" stroke-dasharray="8 6" fill="none"/>
    <polygon points="414,114 374,174 402,174 384,232 434,162 404,162" fill="#F59E0B" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Two Figures Passing Portable Battery Pack -->
    <circle cx="338" cy="292" r="18" fill="#4F46E5"/>
    <path d="M308 358 Q308 322 338 322 Q368 322 368 358 Z" fill="#4F46E5"/>
    <circle cx="462" cy="292" r="18" fill="#10B981"/>
    <path d="M432 358 Q432 322 462 322 Q492 322 492 358 Z" fill="#10B981"/>

    <!-- Portable Battery / Power Bank in Center -->
    <rect x="378" y="302" width="44" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
    <rect x="392" y="294" width="16" height="8" rx="3" fill="#4F46E5"/>
    <rect x="386" y="318" width="28" height="38" rx="4" fill="#10B981"/>
    <!-- Transfer Arrows -->
    <path d="M352 406 L444 406 M432 396 L446 406 L432 416" stroke="#4F46E5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Card 3 (Right): Milestone Outcome (Step Podium + Summit Flag + Star Medal) -->
  <g filter="url(#storyShadow)">
    <rect x="532" y="72" width="228" height="416" rx="22" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
    <rect x="532" y="72" width="228" height="22" rx="11" fill="#10B981"/>

    <!-- Star Medal Emblem -->
    <circle cx="646" cy="176" r="48" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4"/>
    <polygon points="646,140 656,164 682,166 662,182 668,208 646,194 624,208 630,182 610,166 636,164" fill="#F59E0B"/>

    <!-- Rising Step Podium / Staircase -->
    <rect x="562" y="388" width="52" height="58" rx="6" fill="#CBD5E1"/>
    <rect x="620" y="346" width="52" height="100" rx="6" fill="#4F46E5"/>
    <rect x="678" y="302" width="52" height="144" rx="6" fill="#10B981"/>

    <!-- Summit Flag -->
    <line x1="704" y1="302" x2="704" y2="236" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <polygon points="706,238 746,252 706,268" fill="#10B981"/>
  </g>
</svg>
