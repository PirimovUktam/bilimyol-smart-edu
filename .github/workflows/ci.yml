name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web — typecheck, lint, tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required: @supabase/realtime-js needs a native WebSocket.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit / integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: End-to-end learning journey
        run: npm run test:e2e

  supabase-journey:
    name: Supabase — Auth, persisted learning and database regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.114.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start disposable backend
        run: supabase start
      - name: Database and browser integration
        shell: bash
        run: |
          set -euo pipefail
          status="$(supabase status --output json)"
          db="$(jq -er '.DB_URL' <<< "$status")"
          export E2E_SUPABASE_URL="$(jq -er '.API_URL' <<< "$status")"
          export E2E_SUPABASE_ANON_KEY="$(jq -er '.ANON_KEY // .PUBLISHABLE_KEY' <<< "$status")"
          export E2E_MAIL_URL="$(jq -er '.MAILPIT_URL // .INBUCKET_URL' <<< "$status")"
          export E2E_APP_URL=http://127.0.0.1:3000
          for test in supabase/tests/*_regression.sql supabase/tests/retired_relationship_absence.sql; do
            psql "$db" -v ON_ERROR_STOP=1 -f "$test"
          done
          VITE_SUPABASE_URL="$E2E_SUPABASE_URL" \
            VITE_SUPABASE_ANON_KEY="$E2E_SUPABASE_ANON_KEY" \
            npm run dev -- --host 127.0.0.1 --port 3000 --strictPort > /tmp/bilimyol-vite.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 --silent "$E2E_APP_URL" -o /dev/null
          npm run test:e2e:supabase
      - name: Stop disposable backend
        if: always()
        run: supabase stop --no-backup

  mobile:
    name: Mobile — analyze, tests, release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pin the toolchain the project is developed against. A newer beta
          # introduces material.dart deprecation infos that fail `analyze`.
          flutter-version: '3.45.0-0.1.pre'
          channel: beta
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimyol-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
